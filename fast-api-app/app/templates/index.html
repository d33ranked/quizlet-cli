<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Word Game</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="game-container">
        <h1>Deutsches Wortspiel</h1>
        
        <div id="word-card" class="card">
            <button id="start-btn" onclick="nextWord()">Start Game</button>
            
            <div id="game-content" class="hidden">
                <h2 id="german-word">Wort</h2>
                <div id="pos-tag" class="pos-tag"></div>
                <p id="example-sentence"></p>
                
                <input type="text" id="answer-input" placeholder="Type English translation" autocomplete="off">
                <button id="submit-btn" onclick="checkAnswer()" disabled>Submit</button>
            </div>
        </div>

        <div class="score-board">
            Score: <span id="score-val">0</span>
        </div>
    </div>

    <script src="/static/game.js"></script>
</body>
</html>
